<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Six animated pixel Claude poses: working, coffee break, needs you, done, out of quota, and asleep">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141826"/><stop offset="1" stop-color="#0A0C12"/></linearGradient>
<clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
<g id="working" shape-rendering="crispEdges" fill="#D97757"><g class="run"><g class="legs"><rect x="4" y="8" width="1" height="2"/><rect x="12" y="8" width="1" height="2"/></g><rect class="arm" x="1" y="4" width="2" height="2"/><rect x="15" y="4" width="2" height="2"/><rect x="3" width="12" height="8"/><g fill="#141413"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g></g></g>
<g id="coffee" shape-rendering="crispEdges"><g class="breathe" fill="#D97757"><rect x="3" width="12" height="8"/><rect x="1" y="5" width="2" height="2"/><rect x="15" y="5" width="2" height="2"/><rect x="3" y="8" width="5" height="1"/><rect x="10" y="8" width="5" height="1"/><g fill="#141413"><rect x="5" y="3" width="1" height="1"/><rect x="12" y="3" width="1" height="1"/></g></g><g fill="#EDE7DF"><rect x="18" y="7" width="3" height="3"/><rect x="21" y="8" width="1" height="1"/></g><g class="steam" fill="#C9CED6"><rect x="18.5" y="5" width=".6" height="1"/><rect x="20" y="4" width=".6" height="1"/></g></g>
<g id="waiting" shape-rendering="crispEdges"><g fill="#D97757"><rect x="3" width="12" height="8"/><rect x="1" y="4" width="2" height="2"/><rect x="15" y="4" width="2" height="2"/><rect x="4" y="8" width="2" height="2"/><rect x="12" y="8" width="2" height="2"/></g><g fill="#141413"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g><text class="bang" x="17" y="2" fill="#F5A524" font-size="8" font-weight="900">!</text></g>
<g id="done" shape-rendering="crispEdges"><g class="hop"><g fill="#D97757"><rect x="3" width="12" height="8"/><rect x="1" y="3" width="2" height="2"/><rect x="15" y="3" width="2" height="2"/><rect x="4" y="8" width="2" height="2"/><rect x="12" y="8" width="2" height="2"/></g><g fill="#141413"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g></g><text x="18" y="3" fill="#34C77B" font-size="8" font-weight="900">✓</text></g>
<g id="tired" shape-rendering="crispEdges"><g class="pant"><g fill="#D97757"><rect x="3" y="1" width="12" height="8"/><rect x="1" y="6" width="2" height="2"/><rect x="15" y="6" width="2" height="2"/><rect x="3" y="9" width="5" height="1"/><rect x="10" y="9" width="5" height="1"/></g><g fill="#141413"><rect x="5" y="4" width="1" height=".6"/><rect x="12" y="4" width="1" height=".6"/><rect x="8" y="6" width="2" height="1"/></g><rect class="tongue" x="8.6" y="7" width=".9" height="1.5" fill="#F28B9B"/></g><g class="sweat-left" fill="#8FD0FF"><rect x="1" y="1" width=".7" height="1.2"/><rect x="0" y="3" width=".7" height="1"/></g><g class="sweat-right" fill="#8FD0FF"><rect x="16" y="0" width=".7" height="1.2"/><rect x="17" y="2" width=".7" height="1"/></g></g>
<g id="asleep" shape-rendering="crispEdges"><g fill="#D97757"><rect x="3" width="12" height="8"/><rect x="1" y="5" width="2" height="2"/><rect x="15" y="5" width="2" height="2"/><rect x="3" y="8" width="5" height="1"/><rect x="10" y="8" width="5" height="1"/></g><g fill="#141413"><rect x="5" y="3" width="2" height=".5"/><rect x="11" y="3" width="2" height=".5"/></g><text class="zz" x="16" y="1" fill="#C8D0DB" font-size="5" font-weight="700">zz</text></g>
</defs>
<style>
.title{font:700 32px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#F3F4F6}.label{font:600 17px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#C8D0DB}.ground{stroke:#fff;stroke-opacity:.2;stroke-width:2}.road{stroke:#fff;stroke-opacity:.5;stroke-width:2;stroke-dasharray:6 7;animation:road .4s linear infinite}.run{animation:bob .48s step-end infinite}.legs{animation:legs .48s step-end infinite}.arm{animation:arm .48s step-end infinite}.breathe{animation:breathe 2.6s ease-in-out infinite}.steam{animation:steam 1.8s ease-out infinite}.bang{animation:flash 1s step-end infinite}.hop{animation:hop .35s ease-in-out infinite alternate}.pant{animation:pant .42s ease-in-out infinite}.tongue{animation:tongue .42s ease-in-out infinite}.sweat-left{animation:sweatL 1.3s ease-in infinite}.sweat-right{animation:sweatR 1.3s ease-in infinite -.45s}.zz{animation:zz 2.3s ease-out infinite}
@keyframes road{to{stroke-dashoffset:13}}@keyframes bob{50%{transform:translateY(-1px)}}@keyframes legs{50%{transform:translateX(2px)}}@keyframes arm{50%{transform:translateY(1px)}}@keyframes breathe{50%{transform:translateY(-.5px)}}@keyframes steam{0%{opacity:0}30%{opacity:.8}100%{transform:translateY(-3px);opacity:0}}@keyframes flash{50%{opacity:0}}@keyframes hop{to{transform:translateY(-2.5px)}}@keyframes pant{50%{transform:translateY(1px)}}@keyframes tongue{50%{transform:scaleY(1.4)}}@keyframes sweatL{0%{opacity:0}20%{opacity:1}100%{transform:translate(-3px,2px);opacity:0}}@keyframes sweatR{0%{opacity:0}20%{opacity:1}100%{transform:translate(3px,2px);opacity:0}}@keyframes zz{0%{opacity:0}30%{opacity:1}100%{transform:translate(4px,-6px);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)"><rect width="900" height="300" fill="url(#bg)"/><circle cx="45" cy="0" r="160" fill="#D97757" opacity=".09"/><circle cx="810" cy="0" r="190" fill="#365CAA" opacity=".1"/><text class="title" x="450" y="55" text-anchor="middle">Meet the cast</text>
<path class="ground" d="M36 219H864"/><path class="road" d="M50 216H155"/>
<use xlink:href="#working" transform="translate(67 176) scale(4)"/><use xlink:href="#coffee" transform="translate(203 176) scale(4)"/><use xlink:href="#waiting" transform="translate(343 176) scale(4)"/><use xlink:href="#done" transform="translate(486 176) scale(4)"/><use xlink:href="#tired" transform="translate(628 176) scale(4)"/><use xlink:href="#asleep" transform="translate(766 176) scale(4)"/>
<text class="label" x="100" y="257" text-anchor="middle">Working</text><text class="label" x="241" y="257" text-anchor="middle">Coffee break</text><text class="label" x="381" y="257" text-anchor="middle">Needs you</text><text class="label" x="521" y="257" text-anchor="middle">Done</text><text class="label" x="662" y="257" text-anchor="middle">Out of quota</text><text class="label" x="800" y="257" text-anchor="middle">Asleep</text>
</g></svg>
