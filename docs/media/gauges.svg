<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Three animated liquid quota gauges: 34 percent relaxed, 72 percent heads up, 96 percent almost out">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141826"/><stop offset="1" stop-color="#0A0C12"/></linearGradient><clipPath id="frame"><rect width="900" height="220" rx="18"/></clipPath><clipPath id="c1"><circle cx="190" cy="118" r="54"/></clipPath><clipPath id="c2"><circle cx="450" cy="118" r="54"/></clipPath><clipPath id="c3"><circle cx="710" cy="118" r="54"/></clipPath><path id="wave" d="M-120 0 Q-105 -6 -90 0 T-60 0 T-30 0 T0 0 T30 0 T60 0 T90 0 T120 0 T150 0 T180 0 T210 0 T240 0 T270 0 T300 0 V140 H-120 Z"/></defs>
<style>.title{font:700 30px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#F3F4F6}.pct{font:700 28px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#fff;paint-order:stroke;stroke:#141826;stroke-opacity:.65;stroke-width:3px}.label{font:600 16px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#C8D0DB}.ring{fill:none;stroke:#fff;stroke-opacity:.2;stroke-width:2}.track{fill:#fff;fill-opacity:.06}.green{fill:#34C77B}.amber{fill:#F5A524}.red{fill:#F04E3E}.front{animation:wave 2.6s linear infinite}.back{opacity:.5;animation:wave 3.9s linear infinite reverse}.critical.front{animation-duration:1.3s}.critical.back{animation-duration:1.9s}.level-low{animation:low 8s ease-in-out infinite alternate}.level-mid{animation:mid 7s ease-in-out infinite alternate}.level-high{animation:high 5s ease-in-out infinite alternate}@keyframes wave{to{transform:translateX(-60px)}}@keyframes low{to{transform:translateY(-30px)}}@keyframes mid{to{transform:translateY(-17px)}}@keyframes high{to{transform:translateY(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="900" height="220" fill="url(#bg)"/><circle cx="100" cy="0" r="160" fill="#D97757" opacity=".08"/><circle cx="800" cy="0" r="170" fill="#365CAA" opacity=".1"/><text class="title" x="450" y="41" text-anchor="middle">Your quota, as liquid</text>
<circle class="track" cx="190" cy="118" r="54"/><g clip-path="url(#c1)"><g class="level-low"><g transform="translate(190 141)"><use href="#wave" class="back green" transform="translate(0 -3)"/><use href="#wave" class="front green"/></g></g></g><circle class="ring" cx="190" cy="118" r="55"/><text class="pct" x="190" y="128" text-anchor="middle">34%</text><text class="label" x="190" y="198" text-anchor="middle">Relaxed</text>
<circle class="track" cx="450" cy="118" r="54"/><g clip-path="url(#c2)"><g class="level-mid"><g transform="translate(450 98)"><use href="#wave" class="back amber" transform="translate(0 -3)"/><use href="#wave" class="front amber"/></g></g></g><circle class="ring" cx="450" cy="118" r="55"/><text class="pct" x="450" y="128" text-anchor="middle">72%</text><text class="label" x="450" y="198" text-anchor="middle">Heads up</text>
<circle class="track" cx="710" cy="118" r="54"/><g clip-path="url(#c3)"><g class="level-high"><g transform="translate(710 69)"><use href="#wave" class="back red critical" transform="translate(0 -3)"/><use href="#wave" class="front red critical"/></g></g></g><circle class="ring" cx="710" cy="118" r="55"/><text class="pct" x="710" y="128" text-anchor="middle">96%</text><text class="label" x="710" y="198" text-anchor="middle">Almost out</text></g></svg>
