<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Claude Code and Codex CLI send silent asynchronous hooks to local JSON files, which Claude Notch reads without AI service calls">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141826"/><stop offset="1" stop-color="#0A0C12"/></linearGradient><clipPath id="frame"><rect width="900" height="260" rx="18"/></clipPath><g id="runner-mini" shape-rendering="crispEdges"><g class="run" fill="#D97757"><g class="legs"><rect x="4" y="8" width="1" height="2"/><rect x="12" y="8" width="1" height="2"/></g><rect x="1" y="4" width="2" height="2"/><rect x="15" y="4" width="2" height="2"/><rect x="3" width="12" height="8"/><g fill="#141413"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g></g></g></defs>
<style>.title{font:700 30px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#F3F4F6}.box{fill:#fff;fill-opacity:.055;stroke:#fff;stroke-opacity:.17;stroke-width:1.5}.name{font:600 18px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#F3F4F6}.mono{font:500 15px Consolas,ui-monospace,Menlo,monospace;fill:#C8D0DB}.path-text{font-size:12px}.note{font:400 15px "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#A3A9B3}.pipe{fill:none;stroke:#fff;stroke-opacity:.22;stroke-width:2}.dots{fill:none;stroke:#D97757;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 13;animation:flow .7s linear infinite}.run{animation:bob .38s step-end infinite}.legs{animation:legs .38s step-end infinite}@keyframes flow{to{stroke-dashoffset:-14}}@keyframes bob{50%{transform:translateY(-1px)}}@keyframes legs{50%{transform:translateX(2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#frame)"><rect width="900" height="260" fill="url(#bg)"/><circle cx="0" cy="0" r="170" fill="#D97757" opacity=".08"/><circle cx="900" cy="0" r="180" fill="#365CAA" opacity=".1"/><text class="title" x="450" y="45" text-anchor="middle">How it works (no tokens)</text>
<rect class="box" x="34" y="80" width="155" height="49" rx="12"/><rect class="box" x="34" y="145" width="155" height="49" rx="12"/><text class="name" x="111" y="111" text-anchor="middle">Claude Code</text><text class="name" x="111" y="176" text-anchor="middle">Codex CLI</text>
<path class="pipe" d="M189 104H220V137H258 M189 169H220V137"/><path class="dots" d="M189 104H220V137H258 M189 169H220V137"/>
<rect class="box" x="258" y="110" width="190" height="55" rx="12"/><text class="mono" x="353" y="143" text-anchor="middle">hooks (silent, async)</text>
<path class="pipe" d="M448 137H487"/><path class="dots" d="M448 137H487"/>
<rect class="box" x="487" y="110" width="247" height="55" rx="12"/><text class="mono path-text" x="610" y="143" text-anchor="middle">~/.claude/usage/centik/*.json</text>
<path class="pipe" d="M734 137H764"/><path class="dots" d="M734 137H764"/>
<rect x="764" y="96" width="107" height="83" rx="22" fill="#000"/><text class="name" x="817" y="165" text-anchor="middle" font-size="15">Notch</text><use href="#runner-mini" transform="translate(797 106) scale(2.2)"/>
<text class="note" x="450" y="226" text-anchor="middle">Reads local files only. Never calls an AI service.</text></g></svg>
